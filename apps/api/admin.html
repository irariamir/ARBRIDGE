<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARBRIDGE Admin</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#171717;background:#fafafa}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #d4d4d4;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;letter-spacing:-.04em}h2{font-size:20px}button{padding:9px 13px;border:1px solid #006239;background:white;color:#006239;border-radius:3px;font:inherit;cursor:pointer}button.approve{background:#006239;color:white}button.reject{border-color:#a12828;color:#a12828}button:focus-visible{outline:2px solid #006239;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));border-block:1px solid #d4d4d4}.metric{padding:14px}.metric+.metric{border-left:1px solid #d4d4d4}.metric strong{display:block;font-size:24px}.muted{color:#525252;font-size:13px}.receipt{display:grid;grid-template-columns:1fr auto;gap:15px;border-top:1px solid #d4d4d4;padding:18px 0}.actions{display:flex;gap:8px;align-items:center}.notice{border-left:3px solid #006239;padding:12px 16px;background:#e7f6ef}.status{font-family:ui-monospace,monospace;text-transform:uppercase;font-size:11px}.error{color:#a12828}@media(max-width:600px){.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3){border-left:0;border-top:1px solid #d4d4d4}.metric:nth-child(4){border-top:1px solid #d4d4d4}.receipt{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div><h1>ARBRIDGE Admin</h1><span class="muted">ARIAMIR · Subscription and receipt review</span></div><button id="refresh">Refresh</button></header>
<main><p id="notice" class="notice">Loading secure account data…</p><section class="metrics" id="metrics"></section><h2>Payment proof queue</h2><div id="receipts"></div><p class="muted">Receipt and subscription records are temporarily stored in memory and cleared when the API restarts. Connect durable storage before production use.</p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const n=document.querySelector('#notice');try{const r=await fetch('/admin/api/overview',{cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'Admin sign-in required.':'Could not load admin data.');const d=await r.json();n.textContent=d.paymentAvailable?'Manual payment proof review is enabled. Verify each transfer independently before approving.':'Payments are disabled: configure bot token, review group, payment instructions, and reviewer IDs.';document.querySelector('#metrics').innerHTML=[['Users',d.users],['Active plans',d.activeSubscriptions],['Delivered',d.jobs.complete],['Open receipts',d.receipts.filter(x=>x.status==='pending_review').length]].map(([a,b])=>'<div class="metric"><span class="muted">'+esc(a)+'</span><strong>'+esc(b)+'</strong></div>').join('');document.querySelector('#receipts').innerHTML=d.receipts.length?d.receipts.map(x=>'<article class="receipt"><div><strong>'+esc(x.planId)+' plan · Telegram '+esc(x.telegramUserId)+'</strong><div class="muted">'+esc(x.proofFileName||'No proof uploaded')+' · '+new Date(x.createdAt).toLocaleString()+'</div><div class="status">'+esc(x.status)+'</div></div>'+(x.status==='pending_review'?'<div class="actions"><button class="approve" data-id="'+esc(x.id)+'" data-action="approve">Approve</button><button class="reject" data-id="'+esc(x.id)+'" data-action="reject">Reject</button></div>':'')+'</article>').join(''):'<p class="muted">No receipts yet.</p>';}catch(e){n.className='notice error';n.textContent=e.message;}}
async function review(id,action){const note=action==='reject'?prompt('Optional reason to send to the user:')||'':'';const r=await fetch('/admin/api/receipts/'+encodeURIComponent(id)+'/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,note})});if(!r.ok){alert((await r.json()).error||'Review failed.');return;}await load();}
document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#receipts').addEventListener('click',event=>{const button=event.target.closest('button[data-id]');if(button)void review(button.dataset.id,button.dataset.action);});load();
</script>
</body></html>
